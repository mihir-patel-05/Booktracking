name: PageFlow web

on:
  pull_request:
    paths: ["web/**", "supabase/**", "amplify.yml"]
  push:
    branches: ["codex/pageflow-web"]
    paths: ["web/**", "supabase/**", "amplify.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run lint
      - run: npm run build

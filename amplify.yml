version: 1

applications:
  - appRoot: web
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - npm --prefix web ci
        build:
          commands:
            - test -n "$NEXT_PUBLIC_SUPABASE_URL"
            - test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
            - env | grep -E '^NEXT_PUBLIC_(SUPABASE_URL|SUPABASE_PUBLISHABLE_KEY|SITE_URL|TURNSTILE_SITE_KEY)=' > web/.env.production
            - npm --prefix web audit --audit-level=high
            - npm --prefix web test
            - npm --prefix web run lint
            - npm --prefix web run build
      artifacts:
        baseDirectory: web/.next
        files:
          - "**/*"
      cache:
        paths:
          - web/node_modules/**/*
          - web/.next/cache/**/*
